services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kafaat
      POSTGRES_USER: kafaat
      POSTGRES_PASSWORD: kafaat
    ports:
      - "5432:5432"
    volumes:
      - kafaat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kafaat -d kafaat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kafaat_postgres_data:
